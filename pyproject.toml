[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "v6-average-py"
version = "1.0.0"
description = "vantage6 average"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pandas",
  "vantage6-algorithm-tools>=5.0.0rc4",
]
authors = [
  { name = "Bart van Beusekom", email = "b.vanbeusekom@iknl.nl" },
]
license = { text = "MIT" }
keywords = ["vantage6", "algorithm", "federated-learning"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/vantage6/v6-average-py"
Repository = "https://github.com/vantage6/v6-average-py"

[tool.hatch.build.targets.wheel]
packages = ["v6-average-py"]

[dependency-groups]
dev = []

[tool.uv]
prerelease = "allow"
